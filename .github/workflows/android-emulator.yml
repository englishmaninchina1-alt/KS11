name: Android app on a real WebView

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

jobs:
  emulator:
    # GitHub-hosted Ubuntu runners expose /dev/kvm, so the emulator runs with
    # hardware acceleration instead of the unusably slow software fallback.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install the SDK pieces the build needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' > /dev/null

      - name: Build the debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Run the app on an emulator
        env:
          # Turn the speech and microphone checks into failures in CI only, where
          # the emulator image is a known quantity (it ships Google's TTS engine).
          STRICT: '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: bash android-app/scripts/emulator-test.sh android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Keep screenshots, UI dumps and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-output
          path: android-app/scripts/out
          if-no-files-found: ignore
